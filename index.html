<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Steinberg Swiss Finance online banking."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f20823'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='15' font-weight='bold' fill='white' text-anchor='middle'%3ESS%3C/text%3E%3C/svg%3E"
    />
    <title>Steinberg Swiss Finance</title>
    <style>
      .boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #fff; z-index: 9999; }
      .boot-loader .spin { width: 46px; height: 46px; border: 4px solid #fbe3e7; border-top-color: #f20823; border-radius: 50%; animation: bootspin 0.8s linear infinite; }
      .boot-loader .boot-logo { width: 64px; height: 64px; animation: bootspin 1s linear infinite; }
      .boot-bar { width: 220px; height: 6px; background: #fbe3e7; border-radius: 999px; overflow: hidden; }
      .boot-bar-fill { width: 0%; height: 100%; background: #f20823; transition: width 0.08s linear; }
      .boot-pct { font-family: sans-serif; color: #848894; font-size: 12px; }
      .boot-loader .boot-text { font-family: sans-serif; color: #848894; font-size: 14px; letter-spacing: 0.4px; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="google_translate_element"></div>
    <div id="root">
      <div class="boot-loader">
        <svg class="boot-logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#f20823"></rect>
          <text x="16" y="22" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">SS</text>
        </svg>
        <div class="boot-text">Loading Steinberg Swiss Finance…</div>
        <div class="boot-bar"><div class="boot-bar-fill" id="boot-fill"></div></div>
        <div class="boot-pct" id="boot-pct">0%</div>
      </div>
      <script>
        (function () {
          var fill = document.getElementById('boot-fill');
          var pct = document.getElementById('boot-pct');
          var p = 0;
          var t = setInterval(function () {
            p = Math.min(100, p + 1);
            if (fill) fill.style.width = p + '%';
            if (pct) pct.textContent = p + '%';
            if (p >= 100) clearInterval(t);
          }, 16);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
